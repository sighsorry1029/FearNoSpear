[General]
## Locks synchronized gameplay settings to the server config when the mod is installed on a server.
## Recommended: On for multiplayer servers.
Lock Configuration = On

## Master switch for all spear safety-net behavior.
Enabled = true

## Chat command used to pin known tracked spear locations.
## This setting is synchronized and can be locked by the server. Leave empty to disable the command.
ChatCommand = !myspear

## Removes the vanilla death map pin when your tombstone is recovered.
## Also removes the death pin from deaths that create no tombstone.
CleanDeathPins = true

[Rescue]
## Rescue timing before TTL expiry, in seconds.
## 1.0 means a tracked spear is rescued during the final second of projectile lifetime if no normal hit occurred.
TTLRescueWindowSeconds = 1.0

## Allows the most recent known owner to rescue if the projectile ZNetView has already become invalid.
## Disable if multiplayer testing shows duplicate rescued spears.
AllowLastKnownOwnerIfZNetViewInvalid = true

## Maximum age, in seconds, for the last-known owner state used by the invalid-ZNetView fallback.
LastKnownOwnerGraceSeconds = 2
