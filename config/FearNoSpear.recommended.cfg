[General]
## Locks synchronized gameplay settings to the server config.
## Applies to OwnerOnlyTombstones, not personal indicators or death pins.
## Spear rescue and thrower-only auto-pickup use fixed internal rules.
Lock Configuration = On

## BeamAndHud: 500-meter column plus icon/distance HUD, with screen-edge direction markers.
## Beam: column only. Hud: HUD only. Off: no display or automatic location queries.
## Beam alone is subject to render distance and terrain. HUD markers are not.
## Personal preference; not synchronized or locked by the server.
SpearIndicatorStyle = BeamAndHud

## Display the nearest 1 to 5 of your tagged spear drops; default 1.
## All displayed spears share one server request. Use style Off to hide indicators.
## Personal preference; not synchronized or locked by the server.
MaxDisplayedSpears = 1

## Removes your death pin when your tombstone is recovered.
## Removes the pin after an 8-second grace period if no tombstone was created.
## Personal preference; not synchronized or locked by the server.
CleanDeathPins = true

## Restricts tombstone access to the owner, or active Clan members including Guests.
## Server admins/hosts in debug mode can bypass this mod's owner restriction.
## Does not override other mods' locks or vanilla container-use and inventory restrictions.
## Synchronized gameplay setting.
OwnerOnlyTombstones = true
